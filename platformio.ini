; PlatformIO Project Configuration for VIEWE UEDX24320028E-WB-A
; ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB Octal PSRAM)
; Smart Home Water Control Node

[platformio]
default_envs = viewe_esp32s3_node

[env:viewe_esp32s3_node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target MCU and CPU Frequency
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB

; Memory Configuration: Octal SPI PSRAM + Quad SPI Flash
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Monitor and Upload settings
monitor_speed = 115200
upload_speed = 921600

; Compiler & Preprocessor Flags
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -O2

; External Libraries
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.0
    lvgl/lvgl @ ^8.3.11
    bblanchon/ArduinoJson @ ^6.21.4
